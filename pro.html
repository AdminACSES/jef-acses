<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accréditation Exposants & Partenaires — 33èmes JEF ACSES 2027</title>
  <style>
    :root { --orange: #D97706; --fonce: #0F172A; }
    * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { margin: 0; background: #FFFBEB; color: #1E293B; padding: 20px 12px; }
    .container { max-width: 720px; margin: 0 auto; background: #fff; border-radius: 14px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); overflow: hidden; }
    .header { background: #fff; padding: 22px 28px; border-bottom: 4px solid var(--orange); display: flex; align-items: center; gap: 20px; }
    .header img { height: 72px; }
    form { padding: 28px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
    @media(max-width: 640px) { .grid { grid-template-columns: 1fr; } }
    label { display: block; font-size: 0.86rem; font-weight: 600; margin-bottom: 5px; }
    input, select, textarea { width: 100%; padding: 10px 12px; border: 1.5px solid #CBD5E1; border-radius: 8px; font-size: 0.95rem; }
    .info-repas { background: #ECFDF5; border: 1px solid #A7F3D0; color: #065F46; padding: 12px 16px; border-radius: 8px; font-weight: 600; margin-bottom: 18px; }
    button { width: 100%; background: var(--orange); color: #fff; border: none; padding: 15px; font-size: 1.05rem; font-weight: 700; border-radius: 10px; cursor: pointer; }
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <img src="logo-acses.png" alt="Logo ACSES">
    <div>
      <h1 style="margin:0; font-size:1.35rem; color:var(--fonce);">Accréditation Exposants & Partenaires</h1>
      <p style="margin:4px 0 0; color:#475569;">33èmes JEF ACSES • 10 et 11 juin 2027 — BIARRITZ</p>
    </div>
  </div>

  <form id="form-pro">
    <div class="info-repas">
      ✓ Les 3 repas (jeudi midi, soirée de gala du jeudi et vendredi midi) sont systématiquement inclus pour tous les exposants.
    </div>

    <div style="margin-bottom:16px;">
      <label>Sélectionnez votre Pass Exposant (2 invitations incluses par partenaire) *</label>
      <select id="typePass" required>
        <option value="Pass Exposant Inclus (N°1)">Pass Exposant Inclus N°1 — Offert (Repas inclus)</option>
        <option value="Pass Exposant Inclus (N°2)">Pass Exposant Inclus N°2 — Offert (Repas inclus)</option>
        <option value="Pass Exposant Supplémentaire (3e et +)">Pass Exposant Supplémentaire (3e personne et +) — 150 € TTC (Repas inclus)</option>
      </select>
    </div>

    <div class="grid">
      <div>
        <label>Société / Entreprise exposante *</label>
        <input type="text" id="organisme" required>
      </div>
      <div>
        <label>N° de Stand ou précision</label>
        <input type="text" id="detailPresence" placeholder="Ex: Stand B4">
      </div>
      <div>
        <label>Civilité *</label>
        <select id="civilite"><option value="M.">M.</option><option value="Mme">Mme</option></select>
      </div>
      <div>
        <label>Fonction *</label>
        <input type="text" id="fonction" required>
      </div>
      <div>
        <label>Nom *</label>
        <input type="text" id="nom" required>
      </div>
      <div>
        <label>Prénom *</label>
        <input type="text" id="prenom" required>
      </div>
      <div>
        <label>Email (pour réception du badge) *</label>
        <input type="email" id="email" required>
      </div>
      <div>
        <label>Téléphone portable *</label>
        <input type="tel" id="telephone" required>
      </div>
    </div>

    <div style="margin-bottom:18px;">
      <label>Régime alimentaire ou allergies</label>
      <input type="text" id="regimeAlimentaire" value="Standard">
    </div>

    <button type="submit" id="btn-submit">Enregistrer mon accréditation Exposant</button>
  </form>

  <div id="resultat" style="display:none; padding:30px; text-align:center;"></div>
</div>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbz8t24mM38r5oJ_G2y0m8sI6yG97k_pA0o9B1o5E7_rN51m63c84n/exec";

  document.getElementById("form-pro").addEventListener("submit", async function(e) {
    e.preventDefault();
    const btn = document.getElementById("btn-submit");
    btn.disabled = true; btn.textContent = "Enregistrement en cours...";
    const payload = {
      action: "inscrire_pro",
      data: {
        typePass: document.getElementById("typePass").value,
        organisme: document.getElementById("organisme").value,
        detailPresence: document.getElementById("detailPresence").value,
        civilite: document.getElementById("civilite").value,
        fonction: document.getElementById("fonction").value,
        nom: document.getElementById("nom").value,
        prenom: document.getElementById("prenom").value,
        email: document.getElementById("email").value,
        telephone: document.getElementById("telephone").value,
        regimeAlimentaire: document.getElementById("regimeAlimentaire").value
      }
    };
    const res = await fetch(API_URL, { method: "POST", body: JSON.stringify(payload) });
    const json = await res.json();
    if (json.succes) {
      document.getElementById("form-pro").style.display = "none";
      const r = document.getElementById("resultat");
      r.style.display = "block";
      r.innerHTML = `<h2 style="color:#059669;">✅ Accréditation enregistrée (${json.id})</h2><p>Vous recevrez votre badge d'accès Exposant par email avant l'événement.</p>`;
    } else {
      alert("Erreur : " + json.message);
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
