<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#0B1220">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; frame-src https://accounts.google.com/gsi/; connect-src https://script.google.com https://script.googleusercontent.com https://accounts.google.com/gsi/; img-src 'self' data: blob: https://*.googleusercontent.com; media-src 'self' blob: mediastream:; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; base-uri 'none'; form-action 'none'; object-src 'none'">
  <title>Scanner accueil - JEF ACSES</title>
  <link rel="icon" href="logo-acses.png">
  <link rel="stylesheet" href="assets/jef.css">
</head>
<body>
  <div id="connexion" class="connexion">
    <div class="carte">
      <img class="logo" src="logo-acses.png" alt="ACSES">
      <h1 style="font-size:1.4rem;">Scanner de l'accueil</h1>
      <p class="petit" style="margin:0;">Connexion avec votre compte <b>@acses-asso.com</b> du bureau.</p>
      <div id="bouton-google"></div>
      <div id="message-connexion" class="erreur-champ" role="alert" style="min-height:1.2em;"></div>
    </div>
  </div>

  <div id="app" class="scanner-app" hidden>
    <div class="barre">
      <img src="logo-acses.png" alt="" style="height:28px;background:#fff;border-radius:6px;padding:2px 4px;">
      <label class="sr" for="creneau">Demi-journée</label>
      <select id="creneau"></select>
      <span class="etat" id="etat"><i></i><span>En ligne</span></span>
    </div>
    <div class="scanner-corps">
      <div class="modes" role="tablist" aria-label="Mode du scanner">
        <button type="button" role="tab" data-mode="accueil" aria-selected="true">Accueil<small>valide la présence</small></button>
        <button type="button" role="tab" data-mode="verifier" aria-selected="false">Vérifier<small>ouvre la fiche</small></button>
      </div>
      <div class="stats-accueil" id="stats">
        <div><b id="st-presents">0</b><small>présents sur ce créneau</small></div>
        <div><b id="st-session">0</b><small>scans sur cet appareil</small></div>
        <div><b id="st-file">0</b><small>en attente d'envoi</small></div>
      </div>
      <div id="lecteur"></div>
      <div style="display:flex;gap:8px;">
        <button class="btn btn-primaire" id="camera" style="flex:1;">📷 Démarrer la caméra</button>
        <button class="btn" id="synchro" hidden>⇅ Envoyer la file</button>
      </div>
      <form class="saisie" id="form-saisie" autocomplete="off">
        <label class="sr" for="saisie">Code du badge</label>
        <input id="saisie" type="text" placeholder="Douchette ou saisie : JEF2027-012" autocapitalize="characters" spellcheck="false">
        <button class="btn" type="submit">Valider</button>
      </form>
      <div id="resultat" class="resultat" role="status" aria-live="assertive"></div>
      <div id="fiche" class="fiche-verif" hidden></div>
      <ul class="historique" id="historique"></ul>
      <div style="display:flex;justify-content:space-between;align-items:center;font-size:.8rem;color:#94A3B8;">
        <span id="utilisateur"></span><button class="btn btn-s btn-fantome" id="deconnexion" style="color:#94A3B8;">Se déconnecter</button>
      </div>
    </div>
  </div>

  <script src="assets/config.js"></script>
  <script src="assets/jef.js"></script>
  <script src="assets/html5-qrcode.min.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="assets/pages/scanner.js"></script>
</body>
</html>
