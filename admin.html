<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0B2540">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Cockpit JEF">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; frame-src https://accounts.google.com/gsi/ blob:; connect-src https://script.google.com https://script.googleusercontent.com https://accounts.google.com/gsi/; img-src 'self' data: blob: https://*.googleusercontent.com; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; base-uri 'none'; form-action 'none'; object-src blob:">
  <title>Cockpit du bureau - JEF ACSES</title>
  <link rel="icon" href="icones/cockpit-192.png">
  <link rel="apple-touch-icon" href="icones/cockpit-180-maskable.png">
  <link rel="manifest" href="cockpit.webmanifest">
  <link rel="stylesheet" href="assets/jef.css?v=2.6.0">
  <link rel="stylesheet" href="assets/cockpit.css?v=2.6.0">
</head>
<body class="cockpit">
  <div id="connexion" class="connexion">
    <div class="carte">
      <img class="logo" src="logo-acses.png" alt="ACSES">
      <h1 style="font-size:1.4rem;">Cockpit du bureau</h1>
      <p class="petit" style="margin:0;">Connectez-vous avec votre compte <b>@acses-asso.com</b>.</p>
      <div id="bouton-google"></div>
      <div id="message-connexion" class="erreur-champ" role="alert" style="min-height:1.2em;"></div>
    </div>
  </div>

  <div id="app" class="cadre" hidden>
    <aside class="menu" id="menu" aria-label="Menu du cockpit">
      <div class="menu-marque"><a href="#portail" class="marque-lien" id="logo-accueil" title="Tous les espaces"><img src="logo-acses.png" alt="Tous les espaces"><div>Cockpit JEF<small id="edition-menu">Journées d'études et de formation</small></div></a>
        <button class="menu-fermer" id="menu-fermer" aria-label="Fermer le menu">✕</button></div>
      <nav id="nav"></nav>
      <div class="menu-bas" id="menu-bas"></div>
    </aside>

    <div class="zone">
      <header class="barre">
        <button class="btn btn-s btn-menu" id="menu-ouvrir" aria-label="Ouvrir le menu">☰</button>
        <h1 id="titre-vue">Tableau de bord</h1>
        <button class="btn btn-s btn-mobile" id="b-cherche" aria-label="Rechercher" aria-expanded="false">🔍</button>
        <button class="btn btn-s btn-mobile" id="b-plus" aria-label="Autres actions" aria-expanded="false">⋯</button>
        <div class="recherche">
          <input type="search" id="recherche" placeholder="Rechercher une personne, une entreprise, un dossier" aria-label="Recherche rapide" autocomplete="off">
          <div class="resultats" id="resultats" hidden></div>
        </div>
        <div class="actions-barre" id="actions-barre">
          <span id="actions-contexte"></span>
          <button class="btn btn-s btn-action" id="b-sur-place" title="Inscrire une personne au dernier moment et imprimer son badge">+ Inscription sur place</button>
          <button class="btn btn-s" id="b-imprimer" title="Imprimer la page affichée">Imprimer</button>
          <div class="deroulant-zone">
            <button class="btn btn-s" id="b-exporter" aria-haspopup="true">Exporter ▾</button>
            <div class="deroulant" id="menu-export" hidden>
              <div class="entete-menu">Fichiers CSV, ouvrables dans Excel</div>
              <button data-export="vue">Le tableau affiché (avec vos filtres)</button>
              <button data-export="participants">Tous les participants</button>
              <button data-export="comptable">Export comptable</button>
              <button data-export="traiteur">Liste pour le traiteur (sans noms)</button>
              <button data-export="presence">Présences par demi-journée</button>
            </div>
          </div>
          <button class="btn btn-s" id="b-actualiser" title="Recharger les données">Actualiser</button>
        </div>
        <span class="etat-synchro" id="etat-synchro">Chargement</span>
        <div class="connectes" id="connectes" aria-label="Personnes connectées"></div>
        <div class="deroulant-zone">
          <button class="avatar-btn" id="b-compte" aria-haspopup="true"></button>
          <div class="deroulant" id="menu-compte" hidden></div>
        </div>
      </header>
      <div id="bandeaux" aria-live="polite"></div>
      <main id="vue" class="page"><div class="chargement"><span class="rotation"></span>Chargement</div></main>
    </div>
  </div>

  <nav class="nav-bas" id="nav-bas" aria-label="Navigation rapide" hidden>
    <button data-nav="portail"><span class="ico">🏠</span>Espaces</button>
    <button data-nav="participants"><span class="ico">👥</span>Participants</button>
    <button class="nav-plus" id="nav-plus" aria-label="Inscription sur place"><span class="ico">＋</span></button>
    <a href="scanner.html" id="nav-scanner"><span class="ico">📷</span>Scanner</a>
    <button id="nav-menu"><span class="ico">☰</span>Menu</button>
  </nav>
  <div class="voile-menu" id="voile-menu"></div>

  <aside class="tiroir" id="tiroir" aria-label="Fiche détaillée" aria-hidden="true"></aside>
  <div class="voile" id="voile"><div class="modale" id="modale" role="dialog" aria-modal="true"></div></div>

  <script src="assets/config.js?v=2.6.0"></script>
  <script src="assets/jef.js?v=2.6.0"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="assets/pages/admin-contenus.js?v=2.6.0"></script>
  <script src="assets/pages/admin.js?v=2.6.0"></script>
</body>
</html>
