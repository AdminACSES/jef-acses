<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; frame-src https://accounts.google.com/gsi/; connect-src https://script.google.com https://script.googleusercontent.com https://accounts.google.com/gsi/; img-src 'self' data: https://*.googleusercontent.com; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; base-uri 'none'; form-action 'none'; object-src 'none'">
  <title>Cockpit du Bureau - JEF ACSES</title>
  <link rel="icon" href="logo-acses.png">
  <link rel="stylesheet" href="assets/jef.css">
</head>
<body>
  <div id="connexion" class="connexion">
    <div class="carte">
      <img class="logo" src="logo-acses.png" alt="ACSES">
      <h1 style="font-size:1.4rem;">Cockpit du Bureau</h1>
      <p class="petit" style="margin:0;">Connexion avec votre compte <b>@acses-asso.com</b>.<br>Seuls les comptes autorisés dans les paramètres ont accès.</p>
      <div id="bouton-google"></div>
      <div id="message-connexion" class="erreur-champ" role="alert" style="min-height:1.2em;"></div>
    </div>
  </div>

  <div id="app" class="app" hidden>
    <aside class="barre-laterale" aria-label="Navigation du cockpit">
      <div class="marque"><img src="logo-acses.png" alt=""><div>Cockpit JEF<small id="edition">2027</small></div></div>
      <button data-vue="tableau" aria-current="page">📊 Tableau de bord</button>
      <button data-vue="stagiaires">🎓 Stagiaires <span class="compteur" id="c-stag" hidden></span></button>
      <button data-vue="badges">🏷️ Badges</button>
      <button data-vue="societes">🏢 Exposants</button>
      <button data-vue="restauration">🍽️ Restauration</button>
      <button data-vue="accueil">✅ Accueil et Qualiopi</button>
      <button data-vue="journal">🧾 Journal</button>
      <button data-vue="reglages">⚙️ Réglages</button>
      <div class="bas"><div id="utilisateur"></div><button id="deconnexion" style="padding:6px 0;font-size:.8rem;">Se déconnecter</button></div>
    </aside>
    <div class="principal">
      <div class="barre-haut">
        <h1 id="titre-vue">Tableau de bord</h1>
        <span id="pastille-test" class="pastille p-ambre" hidden>Mode test</span>
        <div class="droite">
          <select id="export" aria-label="Exporter">
            <option value="">⬇ Exporter...</option>
            <option value="participants">Liste des participants</option>
            <option value="comptable">Export comptable</option>
            <option value="traiteur">Liste traiteur (sans noms)</option>
            <option value="presence">Présences</option>
          </select>
          <a class="btn btn-s" href="scanner.html" target="_blank" rel="noopener">📷 Scanner</a>
          <button class="btn btn-s" id="rafraichir" title="Actualiser">↻ Actualiser</button>
        </div>
      </div>
      <section class="vue" id="vue" aria-live="polite"><div class="chargement"><span class="rotation"></span>Chargement...</div></section>
    </div>
  </div>

  <aside class="tiroir" id="tiroir" aria-label="Fiche détaillée" aria-hidden="true"></aside>
  <div class="voile" id="voile"><div class="modale" id="modale" role="dialog" aria-modal="true"></div></div>

  <script src="assets/config.js"></script>
  <script src="assets/jef.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="assets/pages/admin.js"></script>
</body>
</html>
